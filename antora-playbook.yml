# connectome-fs docs — CI / production (fetch from GitHub)
site:
  title: connectome-fs Docs
  url: https://connectome-fs.github.io/docs
  start_page: home::index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://connectome-fs.github.io/
    site_home_label: connectome-fs home
    header_doc_title: connectome-fs Docs
    site_nav_tree_include: home,connectome-fs
    site_nav_tree_order: home,connectome-fs
    nav_typology_diataxis: 'true'

urls:
  html_extension_style: indexify

antora:
  extensions:
    - require: '@antora-supplemental/facto-stack'
      profile: hub
      lunr:
        index_latest_only: true
        index_by_heading: true
        snippet_length: 200
      siteNavTree:
        enabled: true
        include:
          - home
          - connectome-fs
        order:
          - home
          - connectome-fs
      unversionedComponentUrls:
        mode: alias
      pageContextAntora:
        component: home
        path: keywords

content:
  sources:
    - url: https://github.com/connectome-fs/docs.git
      branches: main
      start_path: docs
    - url: https://github.com/connectome-fs/connectome-fs.git
      branches: main
      start_path: docs

ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: ./build/site

asciidoc:
  extensions:
    - asciidoctor-kroki
    - '@antora-supplemental/page-context'
  attributes:
    stem: latexmath
    kroki-server-url: https://kroki.io
    kroki-fetch-diagram: true
    page-context-active: ''
    page-context-keyword-base: '/home/keywords'
    experimental: ''
    idprefix: ''
    idseparator: '-'
    page-pagination: ''
